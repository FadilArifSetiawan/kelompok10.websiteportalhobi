<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    <div class="page">
        <div class="header">
            <div class="brand">
                <div class="brand-mark"></div>
                <span>RuangHobi</span>
            </div>
            <div class="nav">
                <a href="../index.html">Beranda</a>
                <a href="../pages/bergabung.html">Bergabung</a>
                <a href="../pages/komunitas.html">Komunitas</a>
            </div>
        </div>

        <div class="hero comunity-hero">
            <div class="hero-grid">
                <div class="hero-copy">
                    <h1>Gabung dengan <br> Komunitas Kami</h1>
                    <p>Isi formulir di bawah ini untuk mulai bergabung<br>dan menjadi bagian dari komunitas hobi.</p>
                </div>
            </div>
        </div>

        <div class="form-layout">
            <div class="form-card">
                <h2>Formulir Pendaftaran</h2>
                <div class="form-group">
                    <label>Nama Lengkap *</label>
                    <input type="text" placeholder="Masukan nama Lengkap">
                </div>
                <div class="form-group">
                    <label for="">Email *</label>
                    <input type="email" name="" id="" placeholder="nama@email.com">
                </div>
                <div class="form-group">
                    <label for="">Pilih Komunitas *</label>
                    <select name="" id="">
                        <option value="">-- Pilih Komunitas --</option>
                        <option value="">Fotografi</option>
                        <option value="">Mendaki</option>
                        <option value="">Cerita</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="">Pengalaman di Bidang Ini</label>
                    <div class="radio-group">
                        <div class="radio"><input type="radio" name="" id="">Pemula</div>
                        <div class="radio"><input type="radio" name="" id="">Menengah</div>
                        <div class="radio"><input type="radio">Berpengalaman</div>
                    </div>
                </div>
                <div class="form-group">
                    <label for="">Alasan Bergabung *</label>
                    <textarea placeholder="Ceritakan alasanmu bergabung dengan komunitas ini..."></textarea>
                </div>

                <div class="checkbox">
                    <input type="checkbox"> <span>Saya menyetujui syarat dan ketentuan yang berlaku. *</span>
                </div>
                <a href="#" class="btn" style="width: 100%;">Daftar Sekarang</a>
            </div>

        </div>
    </div>
</body>
</html>
